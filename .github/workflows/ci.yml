name: CI

on:
  push: main
  pull_request: main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        run: pip install -r requirements.txt
      - name: Test script
        run: pytest -q
